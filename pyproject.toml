[project]
name = "grpo-rlvr"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.46",
  "datasets>=2.20",
  "accelerate>=0.34",
  "peft>=0.13",
  "bitsandbytes>=0.44; platform_system == 'Linux'",
  "wandb>=0.18",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "trl>=0.11",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6.3"]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["data", "rewards"]
