model_id: "Qwen/Qwen2.5-0.5B"
task: "countdown"
seed: 0
group_size: 4
max_new_tokens: 128
temperature: 0.8
clip_eps: 0.2
kl_coef: 0.04
learning_rate: 1.0e-5
max_grad_norm: 1.0
prompts_per_step: 2          # -> effective batch = prompts_per_step * group_size
num_train_steps: 100
gradient_checkpointing: true
bf16: true                   # ignored on this local run: policy always loads fp32 (see scripts/train.py); kept for future cloud-GPU use
eval_every_n_steps: 30
save_every_n_steps: 25
wandb_project: "grpo-rlvr-countdown"
